# .github/workflows/github-profile-README.yml
name: github-profile-README

on:
  workflow_dispatch:
  push:
    paths:
      - 'profile/README.md'
    branches:
      - main

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repository
        uses: actions/checkout@v4
        with:
          path: dotgithub

      - name: Checkout <org>.github.io repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}.github.io
          token: ${{ secrets.README }}
          path: pages

      - name: Copy profile/README.md to .github/README.md
        run: |
          mkdir -p dotgithub/.github
          cp dotgithub/profile/README.md dotgithub/.github/README.md

      - name: Copy profile/README.md to <org>.github.io/README.md
        run: |
          cp dotgithub/profile/README.md pages/README.md

      - name: Commit and push .github repository
        run: |
          cd dotgithub
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/README.md
          if git diff --cached --quiet; then
            echo "No changes to commit in .github repo"
          else
            git commit -m "chore: sync profile/README.md to .github/README.md"
            git push
          fi

      - name: Commit and push <org>.github.io repository
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit in .github.io repo"
          else
            git commit -m "chore: sync profile/README.md from .github"
            git push
          fi
