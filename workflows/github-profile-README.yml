# .github/workflows/github-profile-README.yml
name: github-profile-README

on:
  workflow_dispatch:
  push:
    paths:
      - 'profile/README.md'
    branches:
      - main

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout <org>.github.io repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}.github.io
          token: ${{ secrets.README }}
          path: target

      - name: Copy README.md
        run: |
          cp source/profile/README.md target/README.md

      - name: Commit and push
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync README.md from ${{ github.repository }}"
            git push
          fi
